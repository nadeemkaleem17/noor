# CI (plan/14-devops.md section 6, plan/13-quality.md section 5). Runs on every pull request and on master.
# Jobs are added as their parts exist: api-integration (MySQL service) arrives with the first integration test (M0-06),
# e2e with the storefront (M5), lighthouse with the storefront budgets (M5-11), dependency-cruiser with the first API modules (M1-01).
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + lint + tests for every workspace, then the physical-direction check
      - run: pnpm check
      # every route in the contract must be described in plan/10-api
      - run: pnpm route-keys --check
      - run: pnpm build

  # The integration tests and the end-to-end journeys need the real database (plan/14-devops.md section 6): a test that is skipped because MySQL is
  # missing is a failure here, not a green run. Written at M7-01 and not yet run (it needs a push to GitHub).
  mysql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://rubaya_app:ci-app-password@127.0.0.1:3306/rubaya
      DATABASE_MIGRATION_URL: mysql://rubaya_migrate:ci-migrate-password@127.0.0.1:3306/rubaya
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: MySQL 8.4 with the flags of plan/14-devops.md section 3.2
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=ci-root mysql:8.4             --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone=+00:00 --innodb-ft-min-token-size=2
          until docker exec mysql mysqladmin ping -pci-root --silent; do sleep 2; done
          # the two users, as infra/mysql/init/01-users.sql says; '%' because the client comes from outside the container
          sed -e "s/__APP_DB_PASSWORD__/ci-app-password/; s/__MIGRATE_DB_PASSWORD__/ci-migrate-password/; s/'localhost'/'%'/g" infra/mysql/init/01-users.sql | docker exec -i mysql mysql -uroot -pci-root
      - run: pnpm --filter @noor/api db:migrate
      - name: API integration tests (none may be skipped)
        run: |
          pnpm --filter @noor/api test 2>&1 | tee api-test.log
          ! grep -q "integration tests skipped" api-test.log
      - name: End-to-end journeys (Chromium; the smoke set on WebKit)
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          E2E_CHANNEL=chromium E2E_WEBKIT=1 pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report
          path: .data/e2e/results

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # production dependencies only; high and critical advisories fail the build
      - run: pnpm audit --prod --audit-level high

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Conventional Commits (plan/15-conventions.md section 4); the squash commit is the PR title
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            chore
            db
          scopes: |
            api
            admin
            storefront
            contract
            ui
            i18n
            config
            plan
            repo
